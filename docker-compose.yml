version: '3.8'

services:
  # قاعدة البيانات الرئيسية
  postgres:
    image: postgres:15
    container_name: accounting_postgres
    environment:
      POSTGRES_DB: accounting_db
      POSTGRES_USER: accounting_user
      POSTGRES_PASSWORD: accounting_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - accounting_network

  # Redis للتخزين المؤقت
  redis:
    image: redis:7-alpine
    container_name: accounting_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - accounting_network

  # التطبيق الرئيسي
  accounting_app:
    build: .
    container_name: accounting_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://accounting_user:accounting_password@postgres:5432/accounting_db
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-secret-key-here
      - DEBUG=True
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
    networks:
      - accounting_network

  # Nginx كخادم ويب
  nginx:
    image: nginx:alpine
    container_name: accounting_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - accounting_app
    networks:
      - accounting_network

  # مراقبة النظام
  prometheus:
    image: prom/prometheus:latest
    container_name: accounting_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - accounting_network

  grafana:
    image: grafana/grafana:latest
    container_name: accounting_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - accounting_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  accounting_network:
    driver: bridge